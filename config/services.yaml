services:
    # default configuration for services in *this* file
    _defaults:
        # automatically injects dependencies in your services
        autowire: true
        # automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true
        # this means you cannot fetch services directly from the container via $container->get()
        # if you need to do this, you can override this setting on individual services
        public: false

    Torq\PimcoreHelpersBundle\Attribute\:
      resource: '../src/Attribute'
      public: true

    Torq\PimcoreHelpersBundle\Command\:
      resource: '../src/Command'
      public: true

    Torq\PimcoreHelpersBundle\Service\:
        resource: '../src/Service'
        # value objects, not services
        exclude: '../src/Service/DataGeneration/RuleDefinition.php'
        public: true

    Torq\PimcoreHelpersBundle\Repository\:
        resource: '../src/Repository'
        public: true

    Torq\PimcoreHelpersBundle\Webpack\:
        resource: '../src/Webpack'
        public: true

    # Config-driven field-generation engine + generic pre-save listener.
    # The listener's event tags/priority are added by TorqPimcoreHelpersExtension from config.
    Torq\PimcoreHelpersBundle\Service\DataGeneration\DataGenerationEngine:
        arguments:
            $expressionLanguage: '@pimcore.calculated_value.expression_language'
            $managed: '%torq_pimcore_helpers.data_generation.managed%'

    Torq\PimcoreHelpersBundle\EventListener\DataGenerationListener:
        arguments:
            $engine: '@Torq\PimcoreHelpersBundle\Service\DataGeneration\DataGenerationEngine'
